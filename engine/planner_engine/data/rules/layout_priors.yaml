# Deterministic layout priors. Shape limits are derived from the ResPlan dataset
# (m-agour/ResPlan, 17,000 residential plans, CC BY 4.0) - see resplan_priors.json and tools/mine_resplan.py.
# These are design rules (not statutory). Statutory minimums stay in dcpr_2034/ and nbc_2016/.
source: "ResPlan (Agour et al.), CC BY 4.0 - mined 17,000 plans"
aspect_max:            # long side / short side, ~p95 of ResPlan rooms (rounded)
  master: 1.6
  bedroom: 1.6
  study: 1.8
  living: 2.3
  dining: 2.0
  kitchen: 2.0
  toilet: 2.3
  bath: 2.3
  wc: 3.0
  utility: 3.0
  foyer: 8.0
  pooja: 2.0
  store: 3.0
  dress: 3.0
  balcony: 5.0
  passage: 12.0
balcony:
  min_aspect: 1.5          # balconies are elongated (ResPlan median 2.3)
  long_side_outside: true  # 94% of ResPlan balconies expose the long side
  outer_facade_only: true  # never into a re-entrant notch facing the core
  max_depth: 2.0
window_share:              # share of rooms with a window in ResPlan (informs needs_window defaults)
  bedroom: 0.87
  kitchen: 0.94
  living: 0.91
  toilet: 0.93
door_affinity:             # how rooms typically open onto each other (ResPlan via_door counts, normalised)
  bedroom: [passage, living]
  master: [passage, living]
  toilet: [master, bedroom, passage, living]
  balcony: [living, master, bedroom]
  kitchen: [dining, living]
