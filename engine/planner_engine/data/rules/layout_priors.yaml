# Deterministic layout priors. Shape limits are derived from the ResPlan dataset
# (m-agour/ResPlan, 17,000 residential plans, CC BY 4.0) - see resplan_priors.json and tools/mine_resplan.py.
# These are design rules (not statutory). Statutory minimums stay in dcpr_2034/ and nbc_2016/.
source: "ResPlan (Agour et al.), CC BY 4.0 - mined 17,000 plans; aspect limits tightened to the p95 of municipal-approved Mumbai plans where that is tighter (planner_engine/data/mumbai_approved_stats.json, 50 projects, 655 pages)"
aspect_max:            # long side / short side, ~p95 of ResPlan rooms (rounded); Mumbai-approved p95 where tighter (noted per line)
  master: 1.5          # Mumbai approved p95 1.51 (ResPlan 1.6)
  bedroom: 1.6
  study: 1.8
  living: 2.3
  dining: 2.0
  kitchen: 1.8         # Mumbai approved p95 1.76 (ResPlan 2.0)
  toilet: 2.3
  bath: 2.3
  wc: 3.0
  utility: 3.0
  foyer: 5.0           # Mumbai approved p95 5.04 (ResPlan 8.0)
  pooja: 2.0
  store: 3.0
  dress: 3.0
  balcony: 5.0
  passage: 5.5         # Mumbai approved p95 5.40 (ResPlan 12.0)
balcony:
  min_aspect: 1.5          # balconies are elongated (ResPlan median 2.3)
  long_side_outside: true  # 94% of ResPlan balconies expose the long side
  outer_facade_only: true  # never into a re-entrant notch facing the core
  max_depth: 2.0
window_share:              # share of rooms with a window in ResPlan (informs needs_window defaults)
  bedroom: 0.87
  kitchen: 0.94
  living: 0.91
  toilet: 0.93
door_affinity:             # how rooms typically open onto each other, most likely first (informational; not read by the solver)
  # Mumbai approved plans (mumbai_topology_priors.json, room_links.<A>><B>.link, kept when p >= 0.35, n_projects >= 5);
  # the ResPlan order is kept for balcony, whose doors the PDF extractor cannot see (bedroom>balcony link 0.02).
  bedroom: [passage, toilet]     # was [passage, living]; Mumbai: passage 0.65, toilet 0.50, dining 0.30, living 0.13
  master: [toilet, passage]      # was [passage, living]; Mumbai: toilet 0.82, passage 0.57, living 0.19
  toilet: [master, bedroom, passage]  # was [master, bedroom, passage, living]; Mumbai: master 0.52, bedroom 0.41, passage 0.28, living 0.06
  balcony: [living, master, bedroom]  # ResPlan (Mumbai: living 0.65, kitchen 0.67, n = 26-46 flats, 13 projects)
  kitchen: [dining, passage, living]  # was [dining, living]; Mumbai: dining 0.68, passage 0.49, living 0.41
topology:                  # how the engine uses mumbai_topology_priors.json (counted from approved-plan topology)
  source: "tools/derive_topology_priors.py on tools/extract_pdf_topology.py output: 2,153 clean flats, 48 projects"
  min_projects: 5          # a figure backed by fewer projects is never used (the deriver already drops them)
  link_default_min: 0.6    # P(door arc or open gap between the two rooms) >= this: the pair is linked by default
  facade_needs_window_min: 0.8  # P(room touches the façade) >= this: the room needs a window by default
  # Strong means: pooled p >= threshold AND the median across projects >= threshold (one big project cannot carry it).
  # Weak figures change nothing; the programme JSON default stays. Statutory window rules (living, kitchen) are never relaxed.
