[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planner-engine"
version = "1.0.0"
description = "Parametric Apartment Planner - deterministic rules engine, solver, DXF and Claude (MCP) bridge"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "shapely>=2.0",
  "pyproj>=3.6",
  "numpy>=1.26",
  "ortools>=9.10",
  "ezdxf>=1.3",
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pvlib>=0.11", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.6", "anyio>=4"]
crash = ["sentry-sdk>=2"]

[project.scripts]
planner = "planner_engine.cli:main"
planner-mcp = "planner_engine.mcp_server:main"

[tool.setuptools.packages.find]
include = ["planner_engine*"]

[tool.setuptools.package-data]
planner_engine = ["data/**/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running golden tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "E741"]
