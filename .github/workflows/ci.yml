name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Lint
        if: runner.os == 'Linux'
        run: ruff check planner_engine tests
      - name: Unit + integration tests
        run: pytest -q
      - name: Release gates (quick)
        if: runner.os == 'Linux'
        run: planner golden --quick
        env:
          PLANNER_GEOCODER: offline  # live geocoders drift; the gate checks the pipeline, not OSM
      - name: Doctor
        run: planner doctor

  golden:
    name: Golden set (full release gates)
    runs-on: ubuntu-latest
    needs: engine
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: planner golden --verbose | tee golden-report.json
        env:
          PLANNER_GEOCODER: offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-report
          path: engine/golden-report.json

  app:
    name: UI (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  shell:
    name: Desktop shell (Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Stub sidecar for compile
        run: |
          mkdir -p app/src-tauri/binaries
          printf '#!/bin/sh\n' > app/src-tauri/binaries/planner-engine-x86_64-unknown-linux-gnu
          chmod +x app/src-tauri/binaries/planner-engine-x86_64-unknown-linux-gnu
      - run: cargo test --release
        working-directory: app/src-tauri
