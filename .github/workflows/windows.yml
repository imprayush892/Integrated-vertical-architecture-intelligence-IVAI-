name: Windows installer

on:
  push:
    paths: ["windows/**", "engine/**", "app/**", "install-windows.bat", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  setup-exe:
    name: Setup.exe - build, silent install, smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build UI into the engine
        shell: bash
        run: ./scripts/build_web.sh
      - name: Build ApartmentPlanner-Setup.exe
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $env:Path += ";C:\Program Files (x86)\NSIS"
          cd windows; makensis -V2 '-DVERSION=1.0.0' installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Get-Item ..\ApartmentPlanner-Setup.exe
      - name: Silent install (like double-click, no prompts)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\ApartmentPlanner-Setup.exe -ArgumentList "/S" -Wait -PassThru
          Get-Content "$env:TEMP\ApartmentPlanner-install.log" -ErrorAction SilentlyContinue | Select-Object -Last 60
          if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\ApartmentPlanner\Uninstall.exe")) { throw "uninstaller missing" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Apartment Planner.lnk")) { throw "desktop shortcut missing" }
      - name: Doctor
        shell: cmd
        run: '"%LOCALAPPDATA%\ApartmentPlanner\planner.cmd" doctor'
      - name: Start the app and load the UI
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\ApartmentPlanner"
          Start-Process -FilePath "$dir\venv\Scripts\pythonw.exe" -ArgumentList "`"$dir\launch.pyw`""
          $url = $null
          for ($i = 0; $i -lt 90 -and -not $url; $i++) {
            Start-Sleep 1
            try { $info = Get-Content "$env:USERPROFILE\.apartment-planner\server.json" | ConvertFrom-Json; $url = $info.url } catch {}
          }
          if (-not $url) { throw "engine did not start" }
          (Invoke-WebRequest "$url/api/health" -UseBasicParsing).Content
          $html = (Invoke-WebRequest "$url/" -UseBasicParsing).Content
          if ($html -notmatch "Apartment Planner") { throw "UI not served" }
          "UI served at $url"
      - name: Full demo (Lokhandwala, solve all flats, checks, DXF)
        shell: cmd
        run: '"%LOCALAPPDATA%\ApartmentPlanner\planner.cmd" demo --out demo'
      - name: Uninstall
        shell: pwsh
        run: |
          Start-Process -FilePath "$env:LOCALAPPDATA\ApartmentPlanner\Uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep 5
          if (Test-Path "$env:LOCALAPPDATA\ApartmentPlanner\venv") { throw "uninstall left files" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApartmentPlanner-Setup
          path: |
            ApartmentPlanner-Setup.exe
            demo/*.dxf

  offline-installer:
    name: Offline desktop installer (Tauri, bundled engine)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build UI into the engine
        shell: bash
        run: ./scripts/build_web.sh
      - name: Freeze the engine
        shell: bash
        working-directory: engine
        run: |
          pip install -e ".[dev]"
          cd packaging && pyinstaller planner-engine.spec --noconfirm --distpath ../dist
          ../dist/planner-engine.exe doctor
          mkdir -p ../../app/src-tauri/binaries
          cp ../dist/planner-engine.exe ../../app/src-tauri/binaries/planner-engine-x86_64-pc-windows-msvc.exe
      - name: Build installer
        shell: bash
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ApartmentPlanner-offline-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
