<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Apartment Planner</title>
<!-- Shown by the desktop shell while the local engine starts. Self-contained: no app bundle needed.
     Google Fonts are optional; the stacks fall back to system fonts when offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<style>
/* Tokens: same values as app/src/styles/tokens.css (Anodized Silver / Machined Graphite). */
:root{
  --bg:#E6E9EF; --lt:#F0F3F9; --dk:#DCE0E8; --sh-dark:#C2C7D2; --sh-light:#FFFFFF;
  --chamfer:rgba(255,255,255,.65); --chamfer-in:rgba(163,170,184,.25); --lcd:#E1E5EC; --hair:#CDD2DC;
  --ink-1:#1E2229; --ink-2:#4A505C; --ink-3:#5C6370;
  --det:#0D8A7B; --det-ink:#08675C; --det-glow:rgba(13,138,123,.26); --warn-ink:#8A5200; --fail-ink:#A82424;
  --cobalt:#0066CC; --cobalt-ink:#0058B0;
  --raised:8px 8px 18px var(--sh-dark),-8px -8px 18px var(--sh-light);
  --raised-sm:4px 4px 9px var(--sh-dark),-4px -4px 9px var(--sh-light);
  --inset:inset 4px 4px 9px var(--sh-dark),inset -4px -4px 9px var(--sh-light);
  --f-display:"Plus Jakarta Sans","Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-sans:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E2127; --lt:#23272E; --dk:#191C21; --sh-dark:#121418; --sh-light:#2A2E36;
  --chamfer:rgba(255,255,255,.05); --chamfer-in:rgba(0,0,0,.45); --lcd:#1A1D22; --hair:#2E333C;
  --ink-1:#ECEFF4; --ink-2:#A9B0BC; --ink-3:#8C93A1;
  --det:#24C9B3; --det-ink:#3AD3BE; --det-glow:rgba(36,201,179,.32); --warn-ink:#FFB95A; --fail-ink:#FF8080;
  --cobalt:#3B9EFF; --cobalt-ink:#5AAEFF;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink-1);font:14px/1.5 var(--f-sans);-webkit-font-smoothing:antialiased}
.slab{width:min(420px,100%);padding:34px 30px 26px;border-radius:26px;background:var(--bg);border:1px solid var(--chamfer);box-shadow:var(--raised);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
/* brand mark B: stepped ziggurat (plot boundary > setback envelope > verdigris core) */
.tile{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,var(--lt),var(--dk));border:1px solid var(--chamfer);box-shadow:var(--raised-sm)}
.plot{width:58px;height:58px;border-radius:15px;background:linear-gradient(145deg,var(--dk),var(--lt));box-shadow:var(--inset);display:grid;place-items:center;border:1px solid var(--chamfer-in)}
.setback{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--lt),var(--dk));box-shadow:var(--raised-sm);display:grid;place-items:center;border:1px solid var(--chamfer)}
.core{width:17px;height:17px;border-radius:5px;background:var(--det);box-shadow:0 0 12px var(--det-glow);animation:glow 2.4s ease-in-out infinite}
h1{margin:0;font:800 22px/1.15 var(--f-display);letter-spacing:-.02em}
.sub{margin:2px 0 0;font:700 10px var(--f-mono);letter-spacing:.2em;color:var(--ink-3)}
/* indeterminate channel */
.channel{width:100%;height:12px;border-radius:999px;background:var(--lcd);box-shadow:var(--inset);overflow:hidden;position:relative}
.channel i{position:absolute;top:2px;bottom:2px;width:34%;border-radius:999px;background:var(--det);box-shadow:0 0 8px var(--det-glow);animation:slide 1.5s var(--e,cubic-bezier(.22,1,.36,1)) infinite}
.status{display:flex;align-items:center;justify-content:center;gap:9px;font:600 13px var(--f-sans);color:var(--ink-1);min-height:22px}
.led{width:8px;height:8px;border-radius:50%;background:var(--det);box-shadow:0 0 8px var(--det-glow);flex:none;animation:glow 1.6s ease-in-out infinite}
.help{margin:0;font-size:12.5px;color:var(--ink-2);max-width:34ch}
.slow{display:none;flex-direction:column;align-items:center;gap:10px}
.slow.on{display:flex}
.slow .led{background:#D98200;box-shadow:0 0 8px rgba(217,130,0,.3);animation:none}
.slow .status{color:var(--warn-ink)}
button{appearance:none;font:600 13px var(--f-sans);color:var(--cobalt-ink);padding:9px 20px;min-height:38px;border-radius:999px;border:1px solid var(--chamfer);background:linear-gradient(145deg,var(--lt),var(--dk));box-shadow:var(--raised-sm);cursor:pointer}
button:hover{transform:translateY(-1px)}
button:active{box-shadow:var(--inset);background:var(--bg);transform:none}
button:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
.foot{font:500 11px var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
@keyframes slide{0%{left:-36%}100%{left:102%}}
@keyframes glow{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){
  .channel i{animation:none;left:0;width:100%;opacity:.5}
  .core,.led{animation:none}
}
</style>
</head>
<body>
<main class="slab" aria-labelledby="t">
  <div class="tile" aria-hidden="true"><div class="plot"><div class="setback"><div class="core"></div></div></div></div>
  <div>
    <h1 id="t">Apartment Planner</h1>
    <p class="sub">IVAI</p>
  </div>
  <div class="channel" role="progressbar" aria-label="Starting the planner engine"><i></i></div>
  <div class="status" role="status" aria-live="polite"><span class="led" aria-hidden="true"></span><span id="msg">Starting the planner engine…</span></div>
  <p class="help" id="help">Rules first. Claude only for the unclear choices.</p>
  <div class="slow" id="slow">
    <div class="status" role="alert"><span class="led" aria-hidden="true"></span><span>Taking longer than usual.</span></div>
    <p class="help">The engine may still be warming up. If this stays, run <code>planner-engine doctor</code> in a terminal.</p>
    <button type="button" id="retry">Try again</button>
  </div>
  <div class="foot">DCPR 2034.1 · NBC 2016</div>
</main>
<script>
// After 20 s with no handover, say so and offer a reload. The shell navigates away on its own when ready.
setTimeout(function () {
  document.getElementById('slow').className = 'slow on';
  document.getElementById('msg').parentNode.style.display = 'none';
  document.getElementById('help').style.display = 'none';
  var r = document.getElementById('retry');
  r.addEventListener('click', function () { location.reload(); });
  r.focus();
}, 20000);
</script>
<noscript><style>.channel i{animation:none;left:0;width:100%}</style></noscript>
</body>
</html>
