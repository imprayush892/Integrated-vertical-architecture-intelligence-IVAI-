<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Apartment Planner</title>
<style>
:root{--bg:#f4f5f7;--fg:#18202c;--teal:#0f8b8d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--fg:#e7eaf0}}
body{margin:0;height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
.s{width:28px;height:28px;border:3px solid #0f8b8d33;border-top-color:var(--teal);border-radius:50%;animation:r .8s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
</style></head>
<body><div><div class="s"></div>Starting the planner engine…</div></body></html>
